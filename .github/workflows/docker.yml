name: Build a push image do GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GHCR neakceptuje velká písmena v názvu image, ale ${{ github.repository }}
      # je "Owner/repo" — může velká písmena obsahovat.
      - name: Název image malými písmeny
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagy a labely
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build a push
        uses: docker/build-push-action@v6
        with:
          context: .
          # VPS je amd64; multiarch by build zbytečně zdvojnásobil.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bez cache by se celý strom závislostí kompiloval při každém pushi.
          # Spolu s cargo-chef vrstvou v Dockerfile to drží běžný build v jednotkách minut.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Volitelné: řekne Coolify, ať stáhne nový image. Deploy webhook URL a token
      # najdeš v Coolify u resource → Webhooks. Bez těchto secrets se krok přeskočí.
      # `secrets` se nedá použít přímo v `if`, proto přes env (viz job-level env níž).
      - name: Spustit deploy v Coolify
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: |
          curl -fsS -X GET "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
