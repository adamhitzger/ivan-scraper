services:
  ivan-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    # Port se nepublikuje na host — provoz chodí přes reverzní proxy Coolify,
    # doména se nastavuje v UI. Pro lokální běh odkomentuj `ports`.
    expose:
      - "3000"
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
        postgres:
          condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/scraper_db


  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scraper_db
    # DB je dostupná jen z interní docker sítě (hostname `postgres`).
    # Publikovat 5432 na host by ji vystavilo do internetu, proto jen na loopback —
    # kvůli `cargo sqlx prepare`, které se připojuje z hostu na localhost:5432.
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scraper_db"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
