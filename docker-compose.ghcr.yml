# Varianta pro Coolify, když se image staví v GitHub Actions.
# Na VPS se nic nekompiluje — jen se stáhne hotový image z GHCR.
# V Coolify nastav u resource "Docker Compose Location" na tento soubor.
#
# Lokální vývoj běží dál přes docker-compose.yml, který image staví.

services:
  ivan-scraper:
    # DOPLŇ svého GitHub uživatele/organizaci (malými písmeny):
    image: ghcr.io/adamhitzger/ivan-scraper:latest
    # Bez tohohle Coolify při deployi použije `latest`, který už má v lokální cachi,
    # takže by na serveru dál běžela stará verze. `always` si vynutí dotaz do registry.
    pull_policy: always
    expose:
      - "3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
        postgres:
          condition: service_healthy
    environment:
      RUST_LOG: "info,lettre=debug"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/scraper_db

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scraper_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scraper_db"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
